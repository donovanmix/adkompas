<!-- ========================================================================
JAVASCRIPT LOGIC
======================================================================== -->
<script>
(function() {
  // CONFIGURATION BLOCK
  const CONFIG = {
    // Replace with your Railway API domain after deployment (e.g. 'https://ns-api.up.railway.app')
    railwayApiUrl: 'YOUR_RAILWAY_API_ENDPOINT',
    
    // Target WhatsApp business number (include country code)
    whatsappNumber: '60123456789'
  };

  document.addEventListener('DOMContentLoaded', () => {
    // DOM Selection
    const floatBtn = document.getElementById('ns-wa-float-btn');
    const backdrop = document.getElementById('ns-wa-backdrop');
    const modalContainer = document.getElementById('ns-wa-modal');
    const closeBtn = document.getElementById('ns-wa-close-btn');
    const form = document.getElementById('ns-wa-crm-form');
    const submitBtn = document.getElementById('ns-wa-submit-btn');
    const countrySelect = document.getElementById('ns-country-code');
    const countryFlag = document.getElementById('ns-country-flag');
    const mobileInput = document.getElementById('ns-mobile-number');
    const nameInput = document.getElementById('ns-customer-name');
    const companyInput = document.getElementById('ns-company-name');
    const enquirySelect = document.getElementById('ns-enquiry-subject');

    // Country flags map
    const flagUrls = {
      '+60': 'https://flagcdn.com/w40/my.png',
      '+65': 'https://flagcdn.com/w40/sg.png',
      '+62': 'https://flagcdn.com/w40/id.png',
      '+66': 'https://flagcdn.com/w40/th.png',
      '+63': 'https://flagcdn.com/w40/ph.png',
      '+84': 'https://flagcdn.com/w40/vn.png',
      '+1':  'https://flagcdn.com/w40/us.png',
      '+44': 'https://flagcdn.com/w40/gb.png'
    };

    // Toggle Flag UI
    if (countrySelect && countryFlag) {
      countrySelect.addEventListener('change', (e) => {
        const val = e.target.value;
        if (flagUrls[val]) {
          countryFlag.src = flagUrls[val];
        }
      });
    }

    // Modal Control
    function openModal() {
      backdrop.classList.add('active');
    }

    function closeModal() {
      backdrop.classList.remove('active');
      resetErrors();
    }

    function resetErrors() {
      nameInput.classList.remove('ns-shake-error');
      mobileInput.parentElement.classList.remove('ns-shake-error');
      enquirySelect.classList.remove('ns-shake-error');
    }

    if (floatBtn) floatBtn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (backdrop) {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeModal();
      });
    }

    // Toast Utility
    function showNotification(msg, isError = false) {
      let toastContainer = document.querySelector('.ns-toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.className = 'ns-toast-container';
        document.body.appendChild(toastContainer);
      }
      const toast = document.createElement('div');
      toast.className = `ns-toast ${isError ? 'ns-toast-error' : ''}`;
      toast.textContent = msg;
      toastContainer.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Form Handling
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        resetErrors();

        const name = nameInput.value.trim();
        const company = companyInput.value.trim();
        const countryCode = countrySelect.value;
        const phoneRaw = mobileInput.value.trim();
        const enquiry = enquirySelect.value;

        // Validation
        let error = false;
        if (!name) {
          nameInput.classList.add('ns-shake-error');
          error = true;
        }
        const cleanPhone = phoneRaw.replace(/\D/g, '');
        if (!cleanPhone || cleanPhone.length < 5) {
          mobileInput.parentElement.classList.add('ns-shake-error');
          error = true;
        }
        if (!enquiry) {
          enquirySelect.classList.add('ns-shake-error');
          error = true;
        }

        if (error) {
          showNotification('Please fill in all required fields.', true);
          setTimeout(resetErrors, 500);
          return;
        }

        const fullMobile = `${countryCode}${cleanPhone}`;

        // Loading
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        const leadData = {
          name: name,
          company_name: company || null,
          mobile_number: fullMobile,
          enquiry_subject: enquiry
        };

        let saved = false;

        // POST request to Railway server proxying to Supabase
        if (CONFIG.railwayApiUrl && CONFIG.railwayApiUrl !== 'YOUR_RAILWAY_API_ENDPOINT') {
          try {
            const response = await fetch(`${CONFIG.railwayApiUrl.replace(/\/$/, '')}/api/leads`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(leadData)
            });

            if (response.ok) {
              saved = true;
            } else {
              const errData = await response.json();
              console.error('API Error:', errData);
              showNotification('CRM Database issue, forwarding to WhatsApp...', true);
            }
          } catch (err) {
            console.error('Connection failure:', err);
            showNotification('Connection offline, forwarding to WhatsApp...', true);
          }
        } else {
          // Demo fallback
          console.log('Demo save payload:', leadData);
          await new Promise(r => setTimeout(r, 800));
          saved = true;
        }

        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;

        if (saved) {
          showNotification('Details logged to CRM! Opening WhatsApp...');
        }

        // WhatsApp redirect details
        let message = `Hi, I am ${name}`;
        if (company) message += ` from ${company}`;
        message += `. I'm enquiring about ${enquiry}.`;

        const encodedMsg = encodeURIComponent(message);
        const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodedMsg}`;

        setTimeout(() => {
          window.open(waUrl, '_blank');
          closeModal();
          form.reset();
          countrySelect.value = '+60';
          if (countryFlag) countryFlag.src = flagUrls['+60'];
        }, 500);
      });
    }
  });
})();
</script>
